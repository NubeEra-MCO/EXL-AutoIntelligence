<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Policy Servicing Request Desk - Enterprise Insurance Platform" />
    <meta name="theme-color" content="#0E4DA4" />
    <title>Policy Servicing Request Desk</title>
    <style>
      /* Initial loading state before React mounts */
      body { margin: 0; background: #f5f5f5; }
      #loading-screen {
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        font-family: 'Segoe UI', sans-serif;
        color: #0E4DA4;
      }
      .loader {
        width: 40px; height: 40px;
        border: 3px solid rgba(14,77,164,0.2);
        border-top-color: #0E4DA4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader"></div>
      <span>Loading Policy Servicing Request Desk...</span>
    </div>
    <div id="root"></div>
    <script>
      // Remove loading screen when React mounts
      const originalSetAttribute = Element.prototype.setAttribute;
      Element.prototype.setAttribute = function(name, value) {
        originalSetAttribute.call(this, name, value);
        if (this.id === 'root' && this.children.length > 0) {
          const ls = document.getElementById('loading-screen');
          if (ls) ls.style.display = 'none';
        }
      };

      // Also check on MutationObserver
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const ls = document.getElementById('loading-screen');
          if (ls) {
            ls.style.display = 'none';
            observer.disconnect();
          }
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });

      // Timeout fallback - hide loading screen after 5 seconds
      setTimeout(() => {
        const ls = document.getElementById('loading-screen');
        if (ls) ls.style.display = 'none';
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
